<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta id="theme-color" name="theme-color" content="#fafafa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Colour</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='12' r='6' fill='%23e5342b'/%3E%3Ccircle cx='21' cy='12' r='6' fill='%232ca24a'/%3E%3Ccircle cx='16' cy='21' r='6' fill='%232b6fe5'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The drawing surface is transparent; the "paper" is this element's CSS
       background, so switching theme recolours the paper instantly. -->
  <canvas id="board" aria-label="Drawing board"></canvas>

  <!-- Settings: a single gear, top-left, opening a tiny menu. -->
  <div id="settings" class="settings">
    <button id="settings-toggle" class="icon-btn" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="5" r="2" />
        <circle cx="12" cy="12" r="2" />
        <circle cx="12" cy="19" r="2" />
      </svg>
    </button>
    <div id="settings-menu" class="settings-menu" hidden>
      <button id="btn-dark" class="menu-item">Dark mode</button>
      <button id="btn-fullscreen" class="menu-item">Fullscreen</button>
      <button id="btn-save" class="menu-item">Save picture</button>
      <button id="btn-clear" class="menu-item menu-item--danger">Start over</button>
    </div>
  </div>

  <!-- Tools: colours + eraser on top, pen size across the bottom. -->
  <div id="toolbar" class="toolbar">
    <div class="colors" role="radiogroup" aria-label="Colour">
      <button class="swatch is-active" data-color="#e5342b" style="--c:#e5342b" role="radio" aria-checked="true" aria-label="Red"></button>
      <button class="swatch" data-color="#2ca24a" style="--c:#2ca24a" role="radio" aria-checked="false" aria-label="Green"></button>
      <button class="swatch" data-color="#2b6fe5" style="--c:#2b6fe5" role="radio" aria-checked="false" aria-label="Blue"></button>
      <button class="swatch swatch--eraser" data-eraser role="radio" aria-checked="false" aria-label="Eraser">🧹</button>
    </div>
    <div class="slider">
      <div class="track">
        <!-- Wedge grows to the right to show the pen gets bigger that way. -->
        <div class="slider-wedge" aria-hidden="true"></div>
        <!-- Our own knob: positioned so its CENTRE reaches the rims. The native
             range thumb below is invisible and only drives interaction. -->
        <div class="slider-knob" aria-hidden="true"></div>
        <input
          id="size"
          class="size"
          type="range"
          min="4"
          max="80"
          value="24"
          step="1"
          aria-label="Pen size"
        />
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
